services:
  app:
    # Explicit tag so the auto-deploy script can keep the previous build as
    # beaconq-app:previous and retag it back if a new build fails its health check.
    image: beaconq-app:current
    environment:
      # The VM has 3.8 GiB total and mongod needs the larger share; the app's
      # resident set is ~100 MiB in practice, so this is still ample headroom.
      - NODE_OPTIONS=--max-old-space-size=768
      - NODE_ENV=production
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      # Loopback ON PURPOSE. Docker publishes ports by writing to the DOCKER
      # iptables chain, which ufw does NOT filter, so '3000:3000' would expose
      # the API to the internet while ufw still reported the port blocked.
      # nginx proxies to localhost:3000, so nothing else needs to reach it.
      - '127.0.0.1:3000:3000'
    depends_on:
      mongo1:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./log:/app/dist/log
    networks:
      - backend

  # Rely on this separate service due to Windows permissions not translating correctly to the linux context of docker.
  # Here, this initial service will set the appropriate permissions on the keyfile that the mongo nodes will depend on.
  # Note: a keyfile has been generated and set up to enable secure internal communication between the nodes themselves.
  # This is required when the replica set is built with authentication enabled, which is the case here (username & password),
  # though keyfile is also recommended for production.
  # To create keyfile: `openssl rand -base64 756 > mongo-keyfile`
  keyfile-init:
    image: alpine:latest
    command: >
      sh -c "cp /tmp/mongo-keyfile /keyfile/mongo-keyfile &&
             chown 999:999 /keyfile/mongo-keyfile &&
             chmod 400 /keyfile/mongo-keyfile"
    restart: no
    volumes:
      - ./mongo-keyfile:/tmp/mongo-keyfile:ro
      - mongo-keyfile-volume:/keyfile
    networks:
      - backend

  # Adapted from: https://medium.com/workleap/the-only-local-mongodb-replica-set-with-docker-compose-guide-youll-ever-need-2f0b74dd8384
  #
  # SINGLE-MEMBER replica set. `--replSet` is what enables multi-document
  # transactions and change streams, which this codebase uses across ten method
  # modules; that needs a replica set, not three members.
  #
  # Three members were dropped because they would all run on the one VM, which
  # gives no failover - the host is the single point of failure either way -
  # while tripling memory. The VM has 3.8 GiB: three default WiredTiger caches
  # target ~4.2 GiB, and capping them to fit would leave each node with less
  # cache than the ~860 MiB working set. Protection against losing the host
  # comes from the mongo-backup service, not from co-located replicas.
  # To grow into a real multi-host set later, rs.add() on the running set.
  #
  # The member is advertised by container name, so it is reachable only from
  # inside the `backend` network and the port is not published. For local
  # development, `docker-compose.override.yml` publishes it and advertises
  # host.docker.internal so host tools can connect; Compose merges that file
  # automatically and it is gitignored.
  mongo1:
    image: mongo:8.2.1
    # wiredTigerCacheSizeGB is explicit because the default (~50% of RAM - 1 GiB)
    # claims too large a share of a 3.8 GiB host. 1 GiB holds the working set.
    command:
      [
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--port',
        '27017',
        '--keyFile',
        '/keyfile/mongo-keyfile',
        '--wiredTigerCacheSizeGB',
        '1.0',
        '--quiet',
      ]
    depends_on:
      - keyfile-init
    environment:
      # A user with these credentials will automatically be created in the 'admin' database.
      # As such, attempting to manually create that user as part of the mongo-init.js script would lead to an error and start-up issues for mongo.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    healthcheck:
      # Delegates to scripts/mongoHealthcheck.sh, which verifies that the replica set is
      # initialised, that it advertises the container names, and that exactly one primary
      # has been elected. Every failure path in that script exits non-zero, so a broken
      # replica set is reported as unhealthy instead of being hidden behind a swallowed
      # error. See the script header for the full rationale.
      #
      # Reduced frequency to avoid frequent auth/connect chattiness in the server logs.
      test: [ 'CMD-SHELL', 'sh /healthcheck.sh' ]
      interval: 30s
      timeout: 10s
      # The first probe initialises the replica set and exits 1 on purpose, and the
      # container stays unhealthy until an election completes. The app and the backup
      # service depend on this healthcheck, so they no longer start against a database
      # that is not actually usable.
      start_period: 10s
      retries: 10
    restart: unless-stopped
    volumes:
      - mongo1-data:/data/db
      - mongo1-config:/data/configdb
      - mongo-keyfile-volume:/keyfile
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - ./scripts/mongoHealthcheck.sh:/healthcheck.sh:ro
    networks:
      - backend

  backup-script-init:
    image: alpine:latest
    command: >
      sh -c "cp /tmp/backup.sh /scripts/backup.sh &&
             chmod +x /scripts/backup.sh"
    restart: no
    volumes:
      - ./scripts/mongoDBDockerBackup.sh:/tmp/backup.sh:ro
      - backup-script-volume:/scripts
    networks:
      - backend

  mongo-backup:
    image: mongo:8.2.1
    depends_on:
      mongo1:
        condition: service_healthy
      backup-script-init:
        condition: service_completed_successfully
    environment:
      MONGO_HOST: mongo1
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: 7
      BACKUP_INTERVAL: 86400 # 24 hours (daily)
    volumes:
      - ./backups:/backup
      - backup-script-volume:/scripts
    entrypoint: /scripts/backup.sh
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongo1-data:
  mongo1-config:
  mongo-keyfile-volume:
  backup-script-volume:

networks:
  backend:
    driver: bridge
