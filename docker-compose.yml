services:
  app:
    # Explicit tag so the auto-deploy script can keep the previous build as
    # beaconq-app:previous and retag it back if a new build fails its health check.
    image: beaconq-app:current
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
      - NODE_ENV=production
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      mongo1:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./log:/app/dist/log
    networks:
      - backend

  # Rely on this separate service due to Windows permissions not translating correctly to the linux context of docker.
  # Here, this initial service will set the appropriate permissions on the keyfile that the mongo nodes will depend on.
  # Note: a keyfile has been generated and set up to enable secure internal communication between the nodes themselves.
  # This is required when the replica set is built with authentication enabled, which is the case here (username & password),
  # though keyfile is also recommended for production.
  # To create keyfile: `openssl rand -base64 756 > mongo-keyfile`
  keyfile-init:
    image: alpine:latest
    command: >
      sh -c "cp /tmp/mongo-keyfile /keyfile/mongo-keyfile &&
             chown 999:999 /keyfile/mongo-keyfile &&
             chmod 400 /keyfile/mongo-keyfile"
    restart: no
    volumes:
      - ./mongo-keyfile:/tmp/mongo-keyfile:ro
      - mongo-keyfile-volume:/keyfile
    networks:
      - backend

  # Adapted from: https://medium.com/workleap/the-only-local-mongodb-replica-set-with-docker-compose-guide-youll-ever-need-2f0b74dd8384
  #
  # The replica set advertises its members by container name, so it is reachable
  # only from inside the `backend` network. Nothing outside Docker needs to reach
  # MongoDB in production, and not publishing the ports keeps the database off the
  # host's network interface.
  #
  # For local development, `docker-compose.override.yml` re-publishes the ports and
  # re-advertises the members as host.docker.internal so tools on the host (mongosh,
  # MongoDB Compass) can connect. Compose merges it automatically; it is gitignored.
  mongo1:
    # Primary node
    image: mongo:8.2.1
    command: [ '--replSet', 'rs0', '--bind_ip_all', '--port', '27017', '--keyFile', '/keyfile/mongo-keyfile', '--quiet' ]
    depends_on:
      - keyfile-init
    environment:
      # A user with these credentials will automatically be created in the 'admin' database.
      # As such, attempting to manually create that user as part of the mongo-init.js script would lead to an error and start-up issues for mongo.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    healthcheck:
      # Delegates to scripts/mongoHealthcheck.sh, which verifies that the replica set is
      # initialised, that it advertises the container names, and that exactly one primary
      # has been elected. Every failure path in that script exits non-zero, so a broken
      # replica set is reported as unhealthy instead of being hidden behind a swallowed
      # error. See the script header for the full rationale.
      #
      # Reduced frequency to avoid frequent auth/connect chattiness in the server logs.
      test: [ 'CMD-SHELL', 'sh /healthcheck.sh' ]
      interval: 30s
      timeout: 10s
      # The first probe initialises the replica set and exits 1 on purpose, and the
      # container stays unhealthy until an election completes. The app and the backup
      # service depend on this healthcheck, so they no longer start against a database
      # that is not actually usable.
      start_period: 10s
      retries: 10
    restart: unless-stopped
    volumes:
      - mongo1-data:/data/db
      - mongo1-config:/data/configdb
      - mongo-keyfile-volume:/keyfile
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - ./scripts/mongoHealthcheck.sh:/healthcheck.sh:ro
    networks:
      - backend

  mongo2:
    image: mongo:8.2.1
    command: [ '--replSet', 'rs0', '--bind_ip_all', '--port', '27018', '--keyFile', '/keyfile/mongo-keyfile', '--quiet' ]
    restart: unless-stopped
    depends_on:
      - keyfile-init
    volumes:
      - mongo2-data:/data/db
      - mongo2-config:/data/configdb
      - mongo-keyfile-volume:/keyfile
    networks:
      - backend

  mongo3:
    image: mongo:8.2.1
    command: [ '--replSet', 'rs0', '--bind_ip_all', '--port', '27019', '--keyFile', '/keyfile/mongo-keyfile', '--quiet' ]
    restart: unless-stopped
    depends_on:
      - keyfile-init
    volumes:
      - mongo3-data:/data/db
      - mongo3-config:/data/configdb
      - mongo-keyfile-volume:/keyfile
    networks:
      - backend

  backup-script-init:
    image: alpine:latest
    command: >
      sh -c "cp /tmp/backup.sh /scripts/backup.sh &&
             chmod +x /scripts/backup.sh"
    restart: no
    volumes:
      - ./scripts/mongoDBDockerBackup.sh:/tmp/backup.sh:ro
      - backup-script-volume:/scripts
    networks:
      - backend

  mongo-backup:
    image: mongo:8.2.1
    depends_on:
      mongo1:
        condition: service_healthy
      backup-script-init:
        condition: service_completed_successfully
    environment:
      MONGO_HOST: mongo1
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: 7
      BACKUP_INTERVAL: 86400 # 24 hours (daily)
    volumes:
      - ./backups:/backup
      - backup-script-volume:/scripts
    entrypoint: /scripts/backup.sh
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  mongo1-config:
  mongo2-config:
  mongo3-config:
  mongo-keyfile-volume:
  backup-script-volume:

networks:
  backend:
    driver: bridge
